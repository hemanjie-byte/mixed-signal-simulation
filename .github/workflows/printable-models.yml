name: Printable semiconductor teaching models
on:
  push:
    paths: ["printable-models/**", ".github/workflows/printable-models.yml"]
  pull_request:
    paths: ["printable-models/**", ".github/workflows/printable-models.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5
      - run: python printable-models/validation/validate_meshes.py
      - run: python printable-models/validation/validate_delivery.py
