name: V3.3 numerical improvement and GIF validation
on:
  push:
    paths: ["v33/**", "v3/**", "v32/**", ".github/workflows/v33-validation.yml"]
  pull_request:
    paths: ["v33/**", "v3/**", "v32/**", ".github/workflows/v33-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r v33/requirements.txt
      - run: python v33/validation/check_animations.py
      - run: python v33/numerics/analog/run.py
      - run: python v33/numerics/analog/validate.py
      - run: python v33/numerics/dcdc/run.py
      - run: python v33/validation/run_legacy_checks.py
