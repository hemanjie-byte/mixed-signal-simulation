name: V3-5 models, teaching and delivery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r V3-5/requirements.txt
      - run: python V3-5/simulation/V3-3/validation/run_legacy_checks.py
      - run: python V3-5/simulation/V3-3/numerics/analog/validate.py
      - run: python V3-5/simulation/V3-3/numerics/dcdc/tests/run_validation.py
      - run: python V3-5/printing/validation/validate_meshes.py
      - run: python V3-5/validate.py
