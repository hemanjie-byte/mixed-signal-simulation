name: V3 analog model validation
on:
  push:
    paths: ['v3/**', '.github/workflows/v3-validation.yml']
  pull_request:
    paths: ['v3/**', '.github/workflows/v3-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v3/requirements.txt
      - run: python -m pip install -r v3/requirements.txt
      - run: python v3/models/run_simulations.py
      - run: python v3/tests/run_validation.py
