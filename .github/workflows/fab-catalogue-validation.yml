name: Global FAB catalogue and V3-3 sharing validation
on:
  push:
    paths: ["global-fab-processes/**", "V3-3/**", "README.md", "index.html", ".github/workflows/fab-catalogue-validation.yml"]
  pull_request:
    paths: ["global-fab-processes/**", "V3-3/**", "README.md", "index.html", ".github/workflows/fab-catalogue-validation.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python global-fab-processes/build_catalogue.py
      - run: python global-fab-processes/validate_catalogue.py --strict-artifacts
